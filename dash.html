<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SevaConnect</title>
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"/>
  <link rel="stylesheet" href="dash.css"> 
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"/>   
</head>
<body>
  <!-- Side Panel -->
  <div class="side-panel">
    <div class="com">
      <img src="l1-removebg-preview.png" height="70px" width="80px">
      <h2>SevaConnect</h2>
    </div>
    <nav>
      <button><span><i class="ri-dashboard-fill"></i></span> Dashboard</button>
      <button><span><i class="ri-edit-box-line"></i></span> Service Status</button>
      <button><span><i class="ri-edit-box-line"></i></span> Service Request Tracker</button>
      <button><span><i class="ri-edit-box-line"></i></span> Complaint Management</button>
      <button><span><i class="ri-edit-box-line"></i></span> Polls/Surveys</button>
      <button><span><i class="ri-edit-box-line"></i></span> Community</button>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header -->
    <header class="header">
      <div class="search-bar">
        <input type="text" placeholder="Search for services, customer complaint etc ...">
      </div>
    </header>

    <!-- Welcome Content -->
    <div class="content">
      <div class="card">
        Service Status <i class="ri-arrow-right-line"></i>
      </div>
      <div class="card">
        Service Request Tracker <i class="ri-arrow-right-line"></i>
      </div>
      <div class="card">
        Complaint Management <i class="ri-arrow-right-line"></i>
      </div>
      <div class="card">
        Polls/Surveys <i class="ri-arrow-right-line"></i>
      </div>
    </div>
  </div>
  
</body>
</html>
